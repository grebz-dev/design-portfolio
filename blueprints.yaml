name: Design Portfolio
slug: design-portfolio
type: theme
version: 0.1.0
description: A grid-modal design portfolio with project image carousels and details.
icon: rebel
author:
  name: grebz-dev
  email: jgreb314@gmail.com
homepage: https://github.com/grebz-dev/grav-theme-design-portfolio
demo: http://demo.yoursite.com
keywords: grav, theme, etc
bugs: https://github.com/grebz-dev/grav-theme-design-portfolio/issues
readme: https://github.com/grebz-dev/grav-theme-design-portfolio/blob/develop/README.md
license: MIT

dependencies:
  - { name: grav, version: '>=1.6.0' }

form:
  validation: loose
  fields:
    site_background:
      type: colorpicker
      label: Site Background Color
      default: '#ffefb8'
      help: Sets the overall background color for the site.
    header_background:
      type: colorpicker
      label: Header Background Color
      default: '#ffefb8'
      help: Sets the background color for the main header.
    footer_text:
      type: text
      label: Footer Text
      default: '© 2025 Grav. All rights reserved.'
      help: The text to display in the site footer.
